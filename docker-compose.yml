services:
  postgres:
    image: postgres:16
    container_name: learning-notebook-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learning_notebook
    ports:
      # 5433 avoids clashing with an already running PostgreSQL on 5432.
      # If you use this service, point DATABASE_URL at localhost:5433.
      - "5433:5432"
    volumes:
      - notebook_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_notebook"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  notebook_pgdata:
